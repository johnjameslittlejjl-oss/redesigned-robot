name: Live Wakefield Council Bin Schedule

on:
  schedule:
    - cron: '0 6 * * *' # Runs automatically daily at 06:00 UTC
  workflow_dispatch:

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml

      - name: Run Scraper
        run: |
          python scrape_bins.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bins.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Wakefield bins.json" && git push)
