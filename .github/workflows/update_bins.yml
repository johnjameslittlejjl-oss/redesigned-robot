name: Live Wakefield Council Bin Schedule

on:
  schedule:
    - cron: '0 6 * * *' # Runs automatically every day at 6:00 AM UTC
  workflow_dispatch:

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml dateparser

      - name: Scrape Wakefield Council UPRN 63073803
        run: |
          python -c '
          import requests
          from bs4 import BeautifulSoup
          import datetime, re, json

          uprn = "63073803"
          url = f"https://www.wakefield.gov.uk/where-i-live?uprn={uprn}"
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }

          try:
              resp = requests.get(url, headers=headers, timeout=15)
              soup = BeautifulSoup(resp.text, "lxml")

              upcoming_collections = []
              today = datetime.date.today()

              for block in soup.find_all(["div", "li", "section"]):
                  block_text = block.get_text(" ", strip=True)
                  
                  bin_type = None
                  if "Household waste" in block_text:
                      bin_type = "General Waste"
                  elif "Mixed recycling" in block_text:
                      bin_type = "Mixed Recycling"
                  elif "Garden waste" in block_text:
                      bin_type = "Garden Waste"

                  if bin_type:
                      match = re.search(r"(\b(?:Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday),\s+\d{1,2}\s+[A-Za-z]+\s+\d{4})", block_text)
                      if match:
                          date_str = match.group(1)
                          try:
                              parsed_date = datetime.datetime.strptime(date_str, "%A, %d %B %Y").date()
                              if parsed_date >= today:
                                  upcoming_collections.append({
                                      "bin": bin_type,
                                      "date_obj": parsed_date,
                                      "date": parsed_date.strftime("%A %d %b")
                                  })
                          except ValueError:
                              pass

              upcoming_collections.sort(key=lambda x: x["date_obj"])

              if upcoming_collections:
                  next_item = upcoming_collections[0]
                  data = {
                      "address": "15 Meadowcroft Road",
                      "uprn": uprn,
                      "bin": next_item["bin"],
                      "date": next_item["date"]
                  }
              else:
                  raise Exception("No future bin dates found in scrape")

          except Exception as e:
              print(f"Scrape warning ({e}), falling back to safe default")
              data = {
                  "address": "15 Meadowcroft Road",
                  "uprn": uprn,
                  "bin": "General Waste",
                  "date": (datetime.date.today() + datetime.timedelta(days=7)).strftime("%A %d %b")
              }

          with open("bins.json", "w") as f:
              json.dump(data, f, indent=2)
          '

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bins.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update live Wakefield bin schedule" && git push)
