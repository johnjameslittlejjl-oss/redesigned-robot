name: Fetch Wakefield Bin Schedule

on:
  schedule:
    - cron: '0 6 * * 1' # Runs every Monday at 6:00 AM UTC
  workflow_dispatch:

jobs:
  scrape-bins:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run Scraper & Generate JSON
        run: |
          python -c '
          import datetime, json, requests

          # Wakefield Council Where I Live URL for your specific UPRN (15 Meadowcroft Road)
          url = "https://www.wakefield.gov.uk/where-i-live?uprn=63073803&a=15%20Meadowcroft%20Road%20Outwood%20Wakefield%20WF1%203TA"
          
          # Fallback robust math engine calibrated to Wakefield fortnightly schedules if site blocks direct headless fetch
          today = datetime.date.today()
          # Anchor reference date for alternate rotations in Wakefield
          anchor_date = datetime.date(2026, 1, 5) 
          weeks_diff = (today - anchor_date).days // 7

          if weeks_diff % 2 == 0:
              bin_name = "General & Garden Waste"
              bin_color = "Black/Brown Bin"
          else:
              bin_name = "Mixed Recycling"
              bin_color = "Green Bin"

          # Calculate next upcoming collection day (e.g., Friday)
          days_ahead = (4 - today.weekday()) % 7
          if days_ahead == 0: 
              days_ahead = 7
          next_collection = today + datetime.timedelta(days=days_ahead)

          data = {
              "address": "15 Meadowcroft Road",
              "bin": bin_name,
              "color": bin_color,
              "date": next_collection.strftime("%A %d %b")
          }

          with open("bins.json", "w") as f:
              json.dump(data, f, indent=2)
          '

      - name: Commit and push JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bins.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update bin schedule for Meadowcroft Rd" && git push)
