name: Update Bin Schedule

on:
  schedule:
    - cron: '0 6 * * 1' # Runs every Monday at 6:00 AM UTC
  workflow_dispatch:

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate Bin JSON
        run: |
          python -c '
          import datetime, json

          today = datetime.date.today()
          anchor_date = datetime.date(2026, 1, 5) 
          weeks_diff = (today - anchor_date).days // 7

          if weeks_diff % 2 == 0:
              bin_name = "General & Garden Waste"
              bin_color = "Black/Brown Bin"
          else:
              bin_name = "Mixed Recycling"
              bin_color = "Green Bin"

          days_ahead = (4 - today.weekday()) % 7
          if days_ahead == 0: 
              days_ahead = 7
          next_collection = today + datetime.timedelta(days=days_ahead)

          data = {
              "address": "15 Meadowcroft Road",
              "bin": bin_name,
              "color": bin_color,
              "date": next_collection.strftime("%A %d %b")
          }

          with open("bins.json", "w") as f:
              json.dump(data, f, indent=2)
          '

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bins.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update bin schedule" && git push)
